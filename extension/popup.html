<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Netacad-Runner</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <p class="eyebrow">Помощник для курсов</p>
    <h1>Netacad-Runner</h1>
    <p id="state" class="state" role="status" aria-live="polite">Ожидание</p>
  </header>

  <main>
  <div class="course-card">
  <label class="field" for="course">Курс</label>
  <select id="course">
    <option value="ccna1">CCNA 1 — Введение в сети</option>
    <option value="ccna2">CCNA 2 — Коммутация, маршрутизация и Wi-Fi</option>
    <option value="ccna3">CCNA 3 — Корпоративные сети и безопасность</option>
    <option value="python1">Основы Python 1</option>
    <option value="python2">Основы Python 2</option>
    <option value="data">Основы анализа данных</option>
    <option value="cybersecurity">Введение в кибербезопасность</option>
  </select>

  <div class="actions">
    <button type="button" id="start" class="btn primary">Запустить</button>
    <button type="button" id="stop" class="btn" disabled>Остановить</button>
  </div>
  </div>

  <section class="log" aria-label="Журнал действий">
    <h2>Журнал действий</h2>
    <ul id="log"></ul>
  </section>

  <p id="hint" class="hint" role="status" aria-live="polite">Сначала откройте вкладку курса на www.netacad.com.</p>
  </main>

  <footer>
    <a class="author" href="https://github.com/bsanat" target="_blank" rel="noopener noreferrer" aria-label="GitHub — bsanat">
      <img src="icons/github.svg" width="20" height="20" alt="">
      <span>by <strong>bsanat</strong></span>
    </a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
